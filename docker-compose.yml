# =============================================================================
# EzMsg — Local Development
# Usage: docker compose up
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Postgres 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ezmsg-postgres
    environment:
      POSTGRES_USER: ezmsg
      POSTGRES_PASSWORD: ezmsg_dev
      POSTGRES_DB: ezmsg
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezmsg"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezmsg

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ezmsg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezmsg

  # ---------------------------------------------------------------------------
  # Backend — FastAPI (hot-reload)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ezmsg-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ezmsg:ezmsg_dev@postgres:5432/ezmsg
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      DEBUG: "true"
      SIMULATION_MODE: "true"
      JWT_SECRET: dev-secret-change-in-prod-minimum-32-chars
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      CORS_ORIGINS: '["http://localhost:3000"]'
      PROTOCOL_API_KEY: local-dev-key
      ADMIN_EMAIL: admin@ezmsg.dev
      ADMIN_PASSWORD: admin123
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ezmsg

  # ---------------------------------------------------------------------------
  # Worker — background message scheduler
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend/worker
      dockerfile: Dockerfile
    container_name: ezmsg-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://ezmsg:ezmsg_dev@postgres:5432/ezmsg
      REDIS_URL: redis://redis:6379
      SIMULATION_MODE: "true"
      POLL_INTERVAL_SECONDS: "10"
      BATCH_SIZE: "100"
      MAX_RETRY_ATTEMPTS: "8"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/worker/app:/app/app
    command: python -m app.main
    networks:
      - ezmsg

  # ---------------------------------------------------------------------------
  # Frontend — Next.js (hot-reload dev server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ezmsg-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://backend:8000/v1
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    networks:
      - ezmsg

volumes:
  postgres_data:
  redis_data:

networks:
  ezmsg:
    driver: bridge
