services:
  postgres:
    image: postgres:16-alpine
    container_name: ezmsg-postgres
    environment:
      POSTGRES_USER: ezmsg
      POSTGRES_PASSWORD: ezmsg_dev
      POSTGRES_DB: ezmsg
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezmsg"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezmsg-network

  redis:
    image: redis:7-alpine
    container_name: ezmsg-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ezmsg-network

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: ezmsg-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ezmsg:ezmsg_dev@postgres:5432/ezmsg
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:3000"]'
      SIMULATION_MODE: "true"
      DEBUG: "true"
      PROTOCOL_API_KEY: docker-dev-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ezmsg-network

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: ezmsg-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://ezmsg:ezmsg_dev@postgres:5432/ezmsg
      REDIS_URL: redis://redis:6379
      SIMULATION_MODE: "true"
      POLL_INTERVAL_SECONDS: 10
      BATCH_SIZE: 100
      MAX_RETRY_ATTEMPTS: 8
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../worker:/app
    command: python -m app.main
    networks:
      - ezmsg-network

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        API_URL: http://api:8000/v1
    container_name: ezmsg-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    networks:
      - ezmsg-network

volumes:
  postgres_data:
  redis_data:

networks:
  ezmsg-network:
    driver: bridge
