services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: ezmsg-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://app.ezmsg.io"]}
      SIMULATION_MODE: "false"
      DEBUG: "false"
      PROTOCOL_API_KEY: ${PROTOCOL_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: ezmsg-worker
    restart: unless-stopped
    environment:
      EZMSG_DATABASE_URL: ${DATABASE_URL}
      EZMSG_REDIS_URL: ${REDIS_URL}
      EZMSG_SIMULATION_MODE: "false"
      EZMSG_POLL_INTERVAL_SECONDS: "5"
      EZMSG_BATCH_SIZE: "50"
      EZMSG_MAX_RETRIES: "8"
      EZMSG_TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      EZMSG_TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      EZMSG_TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      EZMSG_FCM_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      EZMSG_FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
      EZMSG_SENTRY_DSN: ${SENTRY_DSN:-}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        API_URL: ${API_URL:-http://api:8000/v1}
    container_name: ezmsg-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
